<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tide</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tide">
<meta name="application-name" content="Tide">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --sand:#FBF6EE;--sand-2:#F2E8DA;--ink:#2B2137;--ink-soft:#6F5A70;
  --sea:#3F3049;--tide:#C9852E;--tide-soft:#F3D88D;
  --rose:#A9576B;--amber:#D9AD73;--pink:#E9A8B8;--line:#E8DCC9;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html{height:100%;-webkit-text-size-adjust:100%}
#bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center 28%;
  background-repeat:no-repeat;transition:background-image .001s}
#bgveil{position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(43,33,55,.80) 0%,rgba(43,33,55,.86) 45%,rgba(43,33,55,.93) 100%)}
body{min-height:100%;background:transparent;color:var(--ink);
  font-family:'Karla',system-ui,-apple-system,sans-serif;
  padding-bottom:calc(76px + var(--safe-b));-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain}
input,button,select,textarea{font-size:16px;font-family:'Karla',sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Fraunces',Georgia,serif;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-soft)}
.card .muted,.goal .muted,.stat .muted{color:var(--ink-soft)}
.hide{display:none!important}

.top{position:sticky;top:0;z-index:30;background:rgba(43,33,55,.55);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(14px + var(--safe-t)) 20px 12px;border-bottom:1px solid rgba(255,255,255,.14)}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:21px;letter-spacing:-.01em;color:#FBF6EE}
.brand span{color:#F3D88D}
.eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C9AE8D;font-weight:700}
.period{text-align:right;font-family:'DM Mono',monospace;font-size:10.5px;color:#D9C3B4;line-height:1.4}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(43,33,55,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.14);padding-bottom:var(--safe-b)}
.tabbar button{flex:1;background:none;border:none;cursor:pointer;padding:12px 4px 13px;display:flex;
  flex-direction:column;align-items:center;gap:5px;color:#9C8AA0;-webkit-tap-highlight-color:transparent}
.tabbar .ic{width:20px;height:20px}
.tabbar .tl{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.tabbar button.on{color:#F3D88D}

.sec{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C9AE8D;font-weight:700;margin:26px 0 10px;text-shadow:0 1px 6px rgba(20,14,28,.5)}
.card{background:rgba(251,246,238,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:18px;
  box-shadow:0 6px 22px rgba(20,14,28,.22)}
.hair{height:1px;background:var(--line);margin:16px 0}

.hero{text-align:center;padding:22px 0 6px}
.hero .lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#C9AE8D;font-weight:700}
.hero .amt{font-family:'Fraunces',serif;font-weight:600;font-size:62px;line-height:1;margin:10px 0 6px;letter-spacing:-.03em;color:#FBF6EE;text-shadow:0 2px 20px rgba(20,14,28,.6)}
.hero .amt.over{color:#F0A0B4}
.hero .sub{font-size:12.5px;color:#E3D3C4;text-shadow:0 1px 8px rgba(20,14,28,.6)}

.tidebox{margin-top:18px;background:rgba(251,246,238,.93);-webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);box-shadow:0 6px 22px rgba(20,14,28,.22);border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:16px 14px 10px;overflow:hidden}
.tidehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 4px}
.tidehead b{font-size:11.5px;font-weight:700}
.tidehead span{font-size:10.5px}
.tidelegend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:10px;color:var(--ink-soft)}
.tidelegend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;border-radius:2px}

.advice{background:linear-gradient(160deg,#2B2137,#6F4E68);color:#F6EADA;border-radius:14px;padding:20px;position:relative;overflow:hidden}
.advice::after{content:"";position:absolute;right:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(243,216,141,.34),transparent 70%)}
.advice .kick{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tide-soft);font-weight:700}
.advice .body{font-family:'Fraunces',serif;font-size:19px;line-height:1.38;margin-top:10px;position:relative;z-index:1}
.advice .tail{font-size:12px;color:#D9C3B4;margin-top:10px;line-height:1.5;position:relative;z-index:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(251,246,238,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:13px 14px;
  box-shadow:0 6px 22px rgba(20,14,28,.22)}
.stat .k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.stat .v{font-family:'Fraunces',serif;font-size:25px;font-weight:600;margin-top:5px}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keys button{padding:16px 0;border:1px solid rgba(255,255,255,.45);background:rgba(251,246,238,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:11px;
  font-family:'DM Mono',monospace;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;color:var(--ink)}
.keys button:active{background:var(--sand-2)}
.keys button.wide{grid-column:span 1}

.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{background:rgba(251,246,238,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);color:var(--ink-soft);padding:9px 13px;border-radius:999px;
  cursor:pointer;font-size:12px;font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pill.on{background:var(--sea);border-color:var(--sea);color:#fff}
.pill.on.rose{background:var(--rose);border-color:var(--rose)}
.pill.on.tide{background:var(--tide);border-color:var(--tide)}

.btn{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;font-size:12px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;background:var(--sea);color:#fff;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:disabled{background:var(--sand-2);color:#B7AFA2}
.btn.ghost{background:rgba(251,246,238,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);color:var(--sea)}
.btn.tide{background:var(--tide)}

.inp{width:100%;background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.5);color:var(--ink);padding:13px;border-radius:11px;outline:none}
.inp:focus{border-color:var(--tide)}
.inp::placeholder{color:#B7AFA2}
.inp.m{font-family:'DM Mono',monospace;text-align:right}

.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.rmain{flex:1;min-width:0}
.rt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.ramt{font-family:'DM Mono',monospace;font-size:13.5px;flex:none}
.rx{background:none;border:none;color:#C9BFB0;cursor:pointer;font-size:20px;padding:0 3px;flex:none;line-height:1}

.baritem{margin-bottom:12px}
.bartop{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px;color:#F0E4D6;text-shadow:0 1px 6px rgba(20,14,28,.55)}
.track{height:8px;background:rgba(43,33,55,.28);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s ease}

.goal{background:rgba(251,246,238,.93);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:16px;margin-bottom:12px;
  box-shadow:0 6px 22px rgba(20,14,28,.22)}
.goalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goalname{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
.goalmeta{font-size:11px;color:var(--ink-soft);margin-top:3px}
.ring{flex:none}

.splash{position:fixed;inset:0;z-index:80;background:#2B2137;overflow:hidden;display:flex;
  flex-direction:column;justify-content:flex-end}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
.splash .scrim{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(43,33,55,.32) 0%,rgba(43,33,55,0) 26%,rgba(43,33,55,.55) 62%,rgba(43,33,55,.96) 100%)}
.splash .inner{position:relative;z-index:2;padding:0 26px calc(38px + var(--safe-b));max-width:520px;
  margin:0 auto;width:100%;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.splash h1{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1.08;
  letter-spacing:-.02em;color:#FBF6EE}
.splash h1 em{font-style:italic;color:#F3D88D}
.splash .from{margin-top:18px;padding-left:14px;border-left:2px solid rgba(243,216,141,.55)}
.splash .from p{font-family:'Fraunces',serif;font-size:15.5px;line-height:1.55;color:#EFE2D2;font-style:italic}
.splash .from .sig{font-family:'Karla',sans-serif;font-style:normal;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#C9AE8D;margin-top:10px;font-weight:700}
.splash .go{margin-top:26px;width:100%;padding:16px;border:none;border-radius:12px;background:#F3D88D;color:#2B2137;
  font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.notecard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.notecard img{width:100%;height:150px;object-fit:cover;object-position:center 30%;display:block}
.notecard .nc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,33,55,.15),rgba(43,33,55,.88))}
.notecard .nt{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:2}
.notecard .nt em{font-family:'Fraunces',serif;font-style:italic;font-size:14px;line-height:1.5;color:#F6EADA;display:block}
.notecard .nt .sig{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C9AE8D;font-weight:700;margin-top:8px}
.onb{padding:30px 0 10px}
.onb h1{font-family:'Fraunces',serif;font-size:34px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:#FBF6EE;text-shadow:0 2px 16px rgba(20,14,28,.6)}
.onb p{font-size:14px;color:#E3D3C4;line-height:1.6;margin-top:12px;text-shadow:0 1px 8px rgba(20,14,28,.55)}
.field{margin-top:18px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#C9AE8D;margin-bottom:7px;text-shadow:0 1px 6px rgba(20,14,28,.5)}
.hint{font-size:11.5px;color:#D6C6BA;margin-top:7px;line-height:1.5;text-shadow:0 1px 6px rgba(20,14,28,.5)}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--sea);
  color:#fff;padding:12px 22px;border-radius:99px;z-index:60;font-size:11.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;box-shadow:0 8px 26px rgba(43,33,55,.3);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="bg"></div>
<div id="bgveil"></div>

<div class="top" id="top">
  <div class="top-in">
    <div>
      <div class="eyebrow" id="hello">Ludemia</div>
      <div class="brand">Ti<span>de</span></div>
    </div>
    <div class="period" id="periodLabel"></div>
  </div>
</div>

<div class="wrap"><div id="view"></div></div>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="on">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M2 15c2.5 0 2.5-2.4 5-2.4s2.5 2.4 5 2.4 2.5-2.4 5-2.4 2.5 2.4 5 2.4"/>
      <path d="M2 20c2.5 0 2.5-2.4 5-2.4s2.5 2.4 5 2.4 2.5-2.4 5-2.4 2.5 2.4 5 2.4"/>
      <circle cx="12" cy="6" r="3"/>
    </svg><span class="tl">Today</span>
  </button>
  <button data-tab="spend">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg><span class="tl">Add</span>
  </button>
  <button data-tab="goals">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>
    </svg><span class="tl">Goals</span>
  </button>
  <button data-tab="setup">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
    </svg><span class="tl">Setup</span>
  </button>
</nav>

<div id="toast"></div>

function pad(n){ return String(n).padStart(2,"0"); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseD(s){ var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtD(d){ return d.getDate()+" "+MON[d.getMonth()]; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function money(n,dp){ dp=dp===undefined?2:dp;
  return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function r2(n){ return Math.round(n*100)/100; }

/* ---------- pay period maths (fortnightly) ---------- */
function period(){
  var start;
  if(S.cfg.lastPayday){
    var lp=parseD(S.cfg.lastPayday), now=parseD(today());
    var diff=daysBetween(lp,now);
    var cycles=Math.floor(diff/14);
    if(cycles<0) cycles=0;
    start=new Date(lp.getTime()); start.setDate(start.getDate()+cycles*14);
  } else {
    start=parseD(today());
  }
  var end=new Date(start.getTime()); end.setDate(end.getDate()+13);
  var next=new Date(start.getTime()); next.setDate(next.getDate()+14);
  var dayIdx=Math.max(0,Math.min(13,daysBetween(start,parseD(today()))));
  return { start:start, end:end, next:next, dayIdx:dayIdx, daysLeft:14-dayIdx };
}
function inPeriod(dstr,p){ var d=parseD(dstr); return d>=p.start && d<=p.end; }
function billsTotal(){ return S.cfg.bills.reduce(function(a,b){ return a+(+b.amount||0); },0); }
function periodBills(){ return billsTotal()/2; }  /* monthly bills split over two paychecks */

function figures(){
  var p=period();
  var spent=0, byCat={};
  S.tx.forEach(function(t){ if(inPeriod(t.date,p)){ spent+=t.amount; byCat[t.cat]=(byCat[t.cat]||0)+t.amount; } });
  var todaySpent=0;
  S.tx.forEach(function(t){ if(t.date===today()) todaySpent+=t.amount; });
  var goalPer=S.goals.reduce(function(a,g){ return a+perPeriodFor(g); },0);
  var pool=Math.max(0,S.cfg.pay-periodBills()-goalPer);
  var left=pool-spent;
  var perDay=p.daysLeft>0?left/p.daysLeft:left;
  var pacePerDay=pool/14;
  var expectedSpent=pacePerDay*(p.dayIdx+1);
  return { p:p, spent:spent, byCat:byCat, todaySpent:todaySpent, pool:pool, left:left,
           perDay:perDay, pacePerDay:pacePerDay, expectedSpent:expectedSpent, goalPer:goalPer };
}
function perPeriodFor(g){
  if(!g.target||!g.by) return 0;
  var remain=Math.max(0,g.target-(g.saved||0));
  var d=daysBetween(parseD(today()),parseD(g.by));
  var periods=Math.max(1,Math.ceil(d/14));
  return remain/periods;
}

function advice(){
  var f=figures(), p=f.p, out=[];

  if(!S.cfg.pay){
    return {kick:"First things first",body:"Add your take-home pay in Setup and this becomes useful immediately.",tail:"Everything else builds on that one number."};

    out.push({w:100,kick:"Payday",body:"Fresh money. Move your goal savings across now, before the fortnight starts spending it for you.",
      tail:"You've got "+money(f.pool,0)+" to work with after bills and goals — about "+money(f.pacePerDay,0)+" a day."});
  }
  /* overspent the pool */
  if(f.left<0){
    out.push({w:95,kick:"Over the line",body:"You're "+money(-f.left)+" past this period's spending money with "+p.daysLeft+" day"+(p.daysLeft===1?"":"s")+" to go.",
      tail:"Not a disaster — but the next few days need to be quiet ones. Groceries at home, no delivery."});
  }
  /* running hot */
  else if(f.spent>f.expectedSpent*1.25 && p.dayIdx>=2){

  if(!ySpent && S.tx.length>3 && p.dayIdx>0){

      tail:"Two no-spend days a fortnight is roughly "+money(f.pacePerDay*2,0)+" kept."});
  }

  if(p.daysLeft<=2 && f.left>0){
    out.push({w:65,kick:"Home stretch",body:"Payday in "+p.daysLeft+" day"+(p.daysLeft===1?"":"s")+", and you've still got "+money(f.left,0)+".",

    if(pct>=50 && pct<100){
      out.push({w:58,kick:"Halfway there",body:esc(g.name)+" is "+pct+"% funded. "+money(g.target-(g.saved||0),0)+" to go.",
        tail:"At "+money(perPeriodFor(g),0)+" a paycheck you'll get there on schedule."});
    }
  }
  /* today's spending vs allowance */
  if(f.todaySpent>f.perDay*1.8 && f.todaySpent>25){
    out.push({w:68,kick:"Big day",body:"You've spent "+money(f.todaySpent,0)+" today against a daily pace of about "+money(Math.max(0,f.perDay),0)+".",
      tail:"One day doesn't break a fortnight. Just don't let tomorrow match it."});
  }

  if(out.length){
    out.sort(function(a,b){ return b.w-a.w; });
    return out[0];
  }
  var seed=parseInt(today().replace(/-/g,""),10);
  var pr=PRINCIPLES[seed%PRINCIPLES.length];
  return {kick:"Something to sit with",body:pr[0]+".",tail:pr[1]};
}

function stat(k,v){ return '<div class="stat"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

function tideChart(f){
  var W=300,H=120,PADL=6,PADR=6,PADT=10,PADB=18;
  var iw=W-PADL-PADR, ih=H-PADT-PADB;
  var pool=Math.max(1,f.pool);
  /* planned burn-down */
  var planned=[];
  for(var i=0;i<=14;i++) planned.push({x:PADL+iw*(i/14), y:PADT+ih*(i/14)});
  /* actual remaining by day */
  var run=0, actual=[{x:PADL,y:PADT}];
  for(var d=0; d<=f.p.dayIdx; d++){
    var dd=new Date(f.p.start.getTime()); dd.setDate(dd.getDate()+d);
    var ds=dd.getFullYear()+"-"+pad(dd.getMonth()+1)+"-"+pad(dd.getDate());
    S.tx.forEach(function(t){ if(t.date===ds) run+=t.amount; });
    var frac=Math.min(1.15,run/pool);
    actual.push({x:PADL+iw*((d+1)/14), y:PADT+ih*frac});
  }
  function path(pts){ return pts.map(function(p,i){ return (i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1); }).join(" "); }
  var lastA=actual[actual.length-1];
  var area=path(actual)+" L "+lastA.x.toFixed(1)+" "+(PADT+ih)+" L "+PADL+" "+(PADT+ih)+" Z";
  var behind=f.spent>f.expectedSpent;

  var h='<div class="tidebox"><div class="tidehead"><b>The fortnight</b>'+
    '<span class="mono muted">day '+(f.p.dayIdx+1)+' of 14</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="none" style="height:120px;display:block">'+
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+(behind?"#A9576B":"#C9852E")+'" stop-opacity=".22"/>'+
    '<stop offset="100%" stop-color="'+(behind?"#A9576B":"#C9852E")+'" stop-opacity=".02"/>'+
    '</linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#tg)"/>'+
    '<path d="'+path(planned)+'" fill="none" stroke="#CDBBA6" stroke-width="1.4" stroke-dasharray="3 4"/>'+
    '<path d="'+path(actual)+'" fill="none" stroke="'+(behind?"#A9576B":"#C9852E")+'" stroke-width="2.4" stroke-linejoin="round"/>'+
    '<circle cx="'+lastA.x.toFixed(1)+'" cy="'+lastA.y.toFixed(1)+'" r="4" fill="'+(behind?"#A9576B":"#C9852E")+'"/>'+
    '<line x1="'+PADL+'" y1="'+(PADT+ih)+'" x2="'+(W-PADR)+'" y2="'+(PADT+ih)+'" stroke="#E8DCC9" stroke-width="1"/>'+
    '</svg>'+
    '<div class="tidelegend"><span><i style="background:'+(behind?"#A9576B":"#C9852E")+'"></i>You</span>'+
    '<span><i style="background:#C9BFB0"></i>Even pace</span></div></div>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("button"):null;
  if(!t) return;

  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.key){ keyPress(t.dataset.key); return; }
  if(t.dataset.cat){ S.cat=t.dataset.cat; render(); return; }

  if(t.id==="commit"){
    if(S.amt<=0) return;
    S.tx.unshift({id:String(Date.now())+Math.floor(Math.random()*1000),cat:S.cat,amount:r2(S.amt),
      note:S.note.trim(),date:S.date});
    saveTx(); toast("Logged"); S.amt=0; S.typed=""; S.note=""; S.tab="today"; render(); return;
  }
  if(t.dataset.del){
    S.tx=S.tx.filter(function(x){ return String(x.id)!==String(t.dataset.del); });
    saveTx(); render(); return;
  }

  if(t.id==="addBill"){
    var bn=document.getElementById("bName"), ba=document.getElementById("bAmt");
    var nm=(bn.value||"").trim(), am=parseFloat(ba.value)||0;
    if(!nm||am<=0){ toast("Name and amount needed"); return; }
    S.cfg.bills.push({name:nm,amount:am}); saveCfg();
    bn.value=""; ba.value="";
    if(S.cfg.setupDone) render(); else drawBills("billList",true);
    return;
  }
  if(t.dataset.delbill!==undefined){
    S.cfg.bills.splice(+t.dataset.delbill,1); saveCfg();
    if(S.cfg.setupDone) render(); else drawBills("billList",true);
    return;
  }

  if(t.id==="onbNext"){
    if(S.onb===0){ S.onb=1; renderOnboard(); return; }
    if(S.onb===1){
      var n=document.getElementById("oName").value.trim();
      S.tmp.name=n||"Ludemia"; S.onb=2; renderOnboard(); return;
    }
    if(S.onb===2){
      var pay=parseFloat(document.getElementById("oPay").value)||0;
      var dt=document.getElementById("oDate").value||today();
      if(pay<=0){ toast("Add your take-home pay"); return; }
      S.tmp.pay=pay; S.tmp.lastPayday=dt; S.onb=3; renderOnboard(); return;
    }
  }
  if(t.id==="onbBack"){ S.onb=Math.max(1,S.onb-1); renderOnboard(); return; }
  if(t.id==="onbDone"){
    S.cfg.name=S.tmp.name||"Ludemia";
    S.cfg.pay=S.tmp.pay||0;
    S.cfg.lastPayday=S.tmp.lastPayday||today();
    S.cfg.setupDone=true; saveCfg(); S.tab="today"; render(); toast("Welcome"); return;
  }

  if(t.id==="gCreate"){
    var gn=document.getElementById("gName").value.trim();
    var gt=parseFloat(document.getElementById("gTarget").value)||0;
    var gb=document.getElementById("gBy").value;
    if(!gn||gt<=0){ toast("Name and amount needed"); return; }
    S.goals.push({id:String(Date.now()),name:gn,target:gt,by:gb,saved:0});
    saveGoals(); render(); toast("Goal created"); return;
  }
  if(t.dataset.gadd!==undefined){
    var i=+t.dataset.gadd, inp=document.getElementById("gadd"+i);
    var v=parseFloat(inp.value)||0;
    if(v<=0){ toast("Enter an amount"); return; }
    S.goals[i].saved=(S.goals[i].saved||0)+v; saveGoals(); render(); toast("Added"); return;
  }
  if(t.dataset.gdel!==undefined){
    S.goals.splice(+t.dataset.gdel,1); saveGoals(); render(); return;
  }

  if(t.id==="expBtn"){
    var blob=new Blob([JSON.stringify({v:1,exported:new Date().toISOString(),tx:S.tx,cfg:S.cfg,goals:S.goals},null,2)],
      {type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="tide-backup-"+today()+".json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast("Backup saved"); return;
  }
  if(t.id==="impBtn"){ document.getElementById("impFile").click(); return; }
});

var fi=document.createElement("input");
fi.type="file"; fi.id="impFile"; fi.accept="application/json,.json"; fi.style.display="none";
document.body.appendChild(fi);
fi.addEventListener("change",function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      if(Array.isArray(d.tx)) S.tx=d.tx;
      if(Array.isArray(d.goals)) S.goals=d.goals;
      if(d.cfg) for(var k in d.cfg) S.cfg[k]=d.cfg[k];
      saveTx(); saveCfg(); saveGoals(); render(); toast("Restored");
    }catch(err){ toast("That file wouldn't read"); }
  };
  fr.readAsText(f); e.target.value="";
});

(function(){
  ["apple-touch-icon","icon"].forEach(function(rel){
    var l=document.createElement("link"); l.rel=rel; l.href=IMG_ICON; document.head.appendChild(l); });
})();

/* ---------- boot ---------- */
Promise.all([store.get(K_TX,[]),store.get(K_CFG,null),store.get(K_GOALS,[])]).then(function(r){
  if(Array.isArray(r[0])) S.tx=r[0];
  if(Array.isArray(r[2])) S.goals=r[2];
  if(r[1]){ for(var k in r[1]) if(r[1][k]!==undefined&&r[1][k]!==null) S.cfg[k]=r[1][k];
    if(!Array.isArray(S.cfg.bills)) S.cfg.bills=[]; }
  S.ready=true; render();
}).catch(function(){ render(); });

})();
</script>
</body>
</html>
