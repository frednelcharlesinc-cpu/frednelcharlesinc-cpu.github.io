<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emerald Blood">
<meta name="theme-color" content="#070a08">
<title>Emerald Blood</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#070a08;--panel:rgba(12,18,14,.94);--panel2:#16211a;--line:#2d4434;--text:#eef4ef;--muted:#93ab9b;--green:#46ff95;--green2:#1f7a47;--hp:#ef4b54;--mp:#3fa0ff;--gold:#f2c14e;--scroll:#f3d65c;--scroll2:#e0b93a;--ink:#2a1d0c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',ui-rounded,system-ui,sans-serif;font-weight:700;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.ui{position:fixed;z-index:5}
.hide{display:none!important}
.safe-l{left:max(10px,env(safe-area-inset-left))}
.safe-r{right:max(10px,env(safe-area-inset-right))}

/* ---------- exploration HUD ---------- */
#hud{top:max(6px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 7px 4px;min-width:104px}
.pcard .nm{font-weight:700;font-size:12px;letter-spacing:.5px;color:var(--green);display:flex;justify-content:space-between;gap:6px}
.pcard .row{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.1}
.pcard .row i{flex:1;height:5px;background:#0008;border-radius:2px;overflow:hidden;position:relative;min-width:40px}
.pcard .row i b{position:absolute;inset:0 auto 0 0;background:var(--hp);transition:width .25s}
.pcard .row.mp i b{background:var(--mp)}.pcard .row.st i b{background:linear-gradient(90deg,#ffb050,#ff4a2a)}.pcard .row.st .ic.s{background:none;color:#ffb050;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center}.pcard .row.st.fev span:last-child{color:#ff5a3a;font-weight:700;animation:fevp .5s infinite alternate}@keyframes fevp{to{opacity:.4}}
.pcard .row span:last-child{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.pcard .row .ic{flex:none}
.ic{display:inline-block;width:9px;height:9px;border-radius:50%}
.ic.h{background:var(--hp);clip-path:polygon(50% 95%,0 40%,10% 8%,35% 5%,50% 25%,65% 5%,90% 8%,100% 40%)}
.ic.m{background:radial-gradient(circle at 35% 35%,#bfe3ff,#3fa0ff 60%,#1d4f8a)}
#hudR{top:max(6px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#topRow{display:flex;gap:6px;align-items:center}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
#gold{color:var(--gold)}
#sus{display:flex;gap:2px;align-items:center}
#sus .eye{width:12px;height:7px;border-radius:50%;background:#1f2a23;border:1px solid #3a4a3f}
#sus .eye.on{background:var(--green);box-shadow:0 0 6px var(--green)}
#btnMenu{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px}
#obj{max-width:42vw;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--muted);text-align:right}
#obj b{color:var(--green);font-weight:600}

/* ---------- touch controls ---------- */
#stickZone{left:0;top:0;bottom:0;width:48%;z-index:4}
#stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(0,0,0,.18);pointer-events:none;z-index:6;transform:translate(-50%,-50%)}
#stick b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.35)}
#stickHint{left:max(22px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.14);pointer-events:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25);font-size:11px;text-align:center}
#pad{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.rb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 32%,#3d9a62,#1d5a37 62%,#123d25);border:3px solid #58d58c;color:#eafff1;font-family:'Press Start 2P';font-size:19px;text-shadow:0 2px 0 #0b2a18;box-shadow:0 6px 0 #0c2c1a,0 8px 14px #000a,inset 0 2px 0 rgba(255,255,255,.25);transition:transform .06s,box-shadow .06s,filter .06s}
.rb.press{transform:translateY(5px) scale(.95);box-shadow:0 1px 0 #0c2c1a,0 2px 6px #000a,inset 0 3px 8px rgba(0,0,0,.45);filter:brightness(1.25)}
.sb,.btn,.tbtn,.arr,.choice,#btnMenu{box-shadow:0 3px 0 rgba(0,0,0,.55);transition:transform .06s,box-shadow .06s,filter .06s}
.press.sb,.press.btn,.press.tbtn,.press.arr,.press.choice,#btnMenu.press,.sw button.press,.tabs button.press{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.55);filter:brightness(1.3)}
.rx.press{transform:translateY(4px) scale(.94);filter:brightness(1.35)}
#cmdList button.press{background:rgba(106,74,18,.35);transform:translateX(3px)}
.sb{padding:9px 12px;border-radius:12px;background:rgba(12,18,14,.85);border:2px solid var(--line);font-size:14px;min-width:78px}
.sb.on{border-color:var(--green);color:var(--green);box-shadow:0 0 12px #46ff9555}
#bA{grid-column:2;grid-row:2/4}#bMount{grid-column:1;grid-row:1}#bBlood{grid-column:2;grid-row:1}#bHood{grid-column:1;grid-row:2}#bRun{grid-column:1;grid-row:3}

/* ---------- dialog ---------- */
#dlg{left:0;right:0;bottom:0;height:46%;min-height:150px;z-index:20;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding:0 max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.port{position:relative;flex:none;width:min(40vh,200px);height:min(43vh,216px);border-radius:12px;overflow:hidden;border:3px solid var(--line);background:radial-gradient(circle at 50% 40%,#21342a,#0b110d);transition:filter .2s,transform .2s,opacity .2s;align-self:flex-end}
.port canvas{width:100%;height:100%;image-rendering:pixelated}
.port.dim{filter:brightness(.78) saturate(.85);transform:scale(.95)}
.port.off{opacity:0}
.port .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);font-size:12px;text-align:center;padding:2px;font-weight:700;letter-spacing:.5px}
#portL .tag{color:var(--green)}
#portR .tag{color:#ffd88a}
.port.shine{border-color:#e9a6c4;background:radial-gradient(circle at 50% 35%,#4a2a3a,#140b10 75%);box-shadow:0 0 22px rgba(255,160,200,.45)}
.port.shine::before,.port.shine::after{content:'✦';position:absolute;z-index:2;color:#ffe3f1;font-size:15px;text-shadow:0 0 6px #ff9ccc;animation:tw 1.8s ease-in-out infinite}
.port.shine::before{top:10%;left:12%;animation-delay:.6s;font-size:11px}.port.shine::after{top:18%;right:12%}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.heart{position:fixed;z-index:80;pointer-events:none;font-size:22px;color:#ff8fbf;text-shadow:0 0 8px #ff5c9e;animation:hup 1.4s ease-out forwards}
@keyframes hup{from{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1}to{opacity:0;transform:translateY(-50px) scale(1.2)}}
#dlgBox{flex:1;max-width:620px;margin:0 8px;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:10px 14px 12px;min-height:118px;position:relative;align-self:flex-end;box-shadow:0 6px 24px #000c}
#dlgName{font-weight:700;font-size:16px;color:var(--green);margin-bottom:3px;min-height:18px;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.6)}
#dlgName.npc{color:#ffd88a}
#dlgText{font-size:clamp(15px,2.3vw,19px);line-height:1.3;white-space:pre-wrap;min-height:48px}
#dlgText.narr{font-style:italic;color:#c6d6ca}
#dlgChoiceWrap{position:relative;margin-top:6px}
#dlgChoices{display:flex;flex-direction:column;gap:5px;max-height:min(34vh,calc(100vh - 150px));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding-right:0}
#dlgChoices.two{display:grid;grid-template-columns:1fr 1fr}
#dlgChoiceWrap.scrolls #dlgChoices{padding-right:44px}
#dlgChoiceWrap.more::after{content:'';position:absolute;left:0;right:44px;bottom:0;height:26px;pointer-events:none;background:linear-gradient(transparent,var(--panel));border-radius:0 0 8px 8px}
.chScroll{position:absolute;right:0;width:38px;height:calc(50% - 3px);display:none;align-items:center;justify-content:center;background:var(--panel2);border:2px solid var(--line);border-radius:8px;color:var(--green);font-size:16px;z-index:2}
#dlgChoiceWrap.scrolls .chScroll{display:flex}
#chUp{top:0}#chDn{bottom:0}
.chScroll.off{opacity:.3}
.choice{text-align:left;padding:7px 10px;background:var(--panel2);border:2px solid var(--line);border-radius:8px;font-size:15px;touch-action:pan-y}
#dlgChoices.dense .choice{padding:5px 9px;font-size:14px}
.choice:active,.choice:hover{border-color:var(--green)}
#dlgMore{position:absolute;right:12px;bottom:6px;color:var(--green);font-size:14px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- toast / banner ---------- */
#toast{left:50%;top:max(44px,calc(env(safe-area-inset-top) + 40px));transform:translateX(-50%);max-width:70vw;background:rgba(9,13,11,.94);border:2px solid #2f6b43;padding:6px 14px;border-radius:10px;font-size:14px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
#banner{left:0;right:0;top:34%;text-align:center;font-family:'Press Start 2P';font-size:clamp(13px,2.4vw,20px);color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000;opacity:0;transition:opacity .7s;pointer-events:none;z-index:25}
#banner small{display:block;font-family:'Nunito';font-size:14px;margin-top:8px;color:#cfe8d6}
#banner.on{opacity:1}
#fade{inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:40}
#fade.on{opacity:1;pointer-events:auto}

/* ---------- battle ---------- */
#bui{inset:0;z-index:10;pointer-events:none}
#bparty{position:absolute;top:max(6px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 54px);display:flex;gap:6px}
#bparty .pcard{min-width:118px}
#bparty .pcard .nm{color:#fff;background:var(--c,#2f8a55);margin:-3px -7px 3px;padding:2px 7px;border-radius:6px 6px 0 0}
#bparty .pcard.act{border-color:var(--green);box-shadow:0 0 12px #46ff9566}
#bparty .pcard.ko{filter:grayscale(1) brightness(.6)}
#timeline{position:absolute;right:max(8px,env(safe-area-inset-right));top:max(6px,env(safe-area-inset-top));bottom:max(8px,env(safe-area-inset-bottom));width:40px;background:linear-gradient(#f3d65c,#e0b93a 30%,#3fa0ff 70%,#1d4f8a);border:2px solid #000;border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;gap:3px;align-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#timeline .tl{width:32px;height:32px;border-radius:6px;border:2px solid #000;background:#0d120f;position:relative;overflow:hidden;flex:none}
#timeline .tl canvas{width:100%;height:100%;image-rendering:pixelated}
#timeline .tl.en{border-color:#c33}
#timeline .tl.pl{border-color:#2fbf6a}
#timeline .tl:first-child{outline:2px solid #fff;outline-offset:1px}
#timeline .lbl{font-size:9px;color:#000;font-weight:700}
#bcmd{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,env(safe-area-inset-bottom));pointer-events:auto;display:flex;gap:8px;align-items:flex-end}
.scroll{background:linear-gradient(var(--scroll),var(--scroll2));color:var(--ink);border:3px solid #6a4a12;border-radius:6px;box-shadow:0 4px 0 #3b2a0a,0 8px 18px #000a;position:relative}
.scroll:before,.scroll:after{content:'';position:absolute;left:-6px;right:-6px;height:6px;background:#8a5a1a;border-radius:3px}
.scroll:before{top:-7px}.scroll:after{bottom:-7px}
#cmdList{padding:8px 6px;min-width:170px;display:flex;flex-direction:column;gap:2px}
#cmdList button{text-align:left;padding:4px 10px 4px 18px;font-size:15px;font-weight:600;border-radius:4px;position:relative}
#cmdList button:hover,#cmdList button.sel{background:rgba(106,74,18,.18)}
#cmdList button.sel:before{content:'▶';position:absolute;left:4px;font-size:11px;top:8px}
#cmdList button:disabled{opacity:.4}
#cmdList button small{font-weight:400;font-size:12px;margin-left:6px;opacity:.8}
#cmdCost{position:absolute;top:-30px;left:24px;padding:2px 10px;font-size:14px;font-weight:700;display:none}
#cmdCost.on{display:block}
#cmdDesc{position:absolute;left:max(10px,env(safe-area-inset-left));width:calc(50% - 130px);bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none}
#cmdDesc .scroll{display:inline-block;padding:6px 12px;font-size:14px;max-width:100%;background:#fdf6dc;border-color:#8a6a22}
#react{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 54px);bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
.rx{touch-action:none;-webkit-user-select:none;user-select:none;width:96px;height:96px;border-radius:50%;font-family:'Press Start 2P';font-size:11px;color:#fff;border:3px solid #000;box-shadow:0 6px 0 #000,0 0 18px #0009;transition:transform .06s,filter .06s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.rx small{font-family:'Nunito';font-size:11px;opacity:.85}
#rxDodge{background:radial-gradient(circle at 40% 35%,#6ad7ff,#1b6ea8)}
#rxParry{background:radial-gradient(circle at 40% 35%,#ffe36a,#c07a14)}
.rx:active,.rx.on{transform:scale(.93);filter:brightness(1.25)}
#hitTap{position:absolute;inset:0;pointer-events:auto}
#bmsg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:'Nunito',sans-serif;font-weight:600;font-size:clamp(14px,2.4vw,19px);line-height:1.3;color:#fff;text-align:center;background:rgba(8,12,16,.86);border:2px solid rgba(255,255,255,.18);border-radius:10px;padding:6px 14px;max-width:78vw;text-shadow:0 1px 0 #000;opacity:0;transition:opacity .2s;pointer-events:none}#bmsg b{font-weight:700}
#bmsg.on{opacity:1}
#tgtHint{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-60%);font-size:14px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 12px;pointer-events:auto}
#facePop{position:fixed;bottom:4%;z-index:30;width:min(30vh,150px);height:min(32vh,162px);pointer-events:none;opacity:0;transition:transform .22s ease-out,opacity .22s;filter:drop-shadow(0 0 10px rgba(0,0,0,.8))}#facePop canvas{width:100%;height:100%}#facePop.l{left:1%;transform:translateX(-60%)}#facePop.r{right:12%;transform:translateX(60%)}#facePop.on{opacity:1;transform:translateX(0)}
.wmap{position:relative;width:100%;border-radius:10px;overflow:hidden;border:2px solid #5a4a30}.wmap img{width:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;color:var(--pc);font-size:clamp(11px,1.6vw,16px);line-height:1;cursor:pointer;text-shadow:0 0 3px #000,0 0 6px #000;display:flex;flex-direction:column;align-items:center}
.pin span{display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:rgba(20,14,8,.72);border:1.5px solid var(--pc)}
.pin.big span{width:1.8em;height:1.8em}.pin em{font-style:normal;font-family:'Nunito';font-weight:700;font-size:.72em;color:#fff3dc;white-space:nowrap;margin-top:1px}
.pin.on span{background:var(--pc);color:#000}.pin i{font-style:normal;font-size:.6em;background:#46e070;color:#000;border-radius:4px;padding:0 3px;margin-top:1px}
.comp{display:flex;gap:10px;align-items:center}.comp canvas{width:64px;height:64px;image-rendering:pixelated;background:rgba(0,0,0,.25);border-radius:8px;flex:none}
#cutin{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;pointer-events:none;background:#000}
#cutin .ttl{height:18%;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P';font-size:clamp(14px,3vw,26px);color:#fff;letter-spacing:2px;background:#000;text-shadow:0 0 14px var(--green)}
#cutin .stage{flex:1;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#0b3d63 0 40px,#145a8e 40px 46px,#0b3d63 46px 120px);animation:speed .25s linear infinite}
@keyframes speed{to{background-position:-120px 0}}
#cutin canvas{position:absolute;bottom:0;height:120%;image-rendering:pixelated;transition:transform .35s ease-out}
#cutin .line{position:absolute;left:4%;right:4%;bottom:4%;background:#fffdf4;color:#1a1408;border:3px solid #c9a24a;border-radius:6px;padding:8px 14px;font-size:clamp(15px,2.4vw,20px);box-shadow:0 4px 0 #6a4a12}
#cutin .line b{display:block;font-size:13px;color:#a0281f}

/* ---------- menus ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.card{background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:12px 16px;max-height:100%;overflow:auto;width:min(720px,100%)}
.card h2{font-family:'Nunito';font-weight:900;letter-spacing:.5px;font-size:17px;color:var(--green);margin:2px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border-radius:8px;background:var(--panel2);border:2px solid var(--line);font-size:14px}
.tabs button.on{border-color:var(--green);color:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.stat{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.stat h3{margin:0 0 4px;font-size:15px;color:var(--green)}
.stat p{margin:2px 0;color:var(--muted)}
.stat p b{color:var(--text);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:9px 14px;border-radius:10px;background:var(--panel2);border:2px solid var(--line);font-size:15px}
.btn.pri{border-color:#2f8a55;color:var(--green)}
.btn:active{filter:brightness(1.3)}
.muted{color:var(--muted)}

/* ---------- title / creator ---------- */
#title{background:radial-gradient(circle at 50% 30%,#14301f,#050806 70%);flex-direction:row;gap:4vw;z-index:60}
#title .logo{display:flex;flex-direction:column;align-items:center}
#tcv{width:min(34vh,200px);height:min(34vh,200px);image-rendering:pixelated}
h1{font-family:'Press Start 2P';font-size:clamp(18px,3.4vw,30px);color:var(--green);text-shadow:0 0 18px #46ff9588,0 3px 0 #000;margin:8px 0 2px;text-align:center}
.sub{color:var(--muted);text-align:center;font-size:15px}
#title .menu{display:flex;flex-direction:column;gap:8px;min-width:220px}
.tbtn{padding:11px 16px;background:var(--panel2);border:2px solid #2f8a55;border-radius:12px;font-size:18px;color:var(--green)}
#creator{z-index:60;background:radial-gradient(circle at 30% 40%,#14301f,#050806 75%);align-items:stretch;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#creator .wrap{display:flex;gap:14px;width:100%;max-width:980px;margin:auto;height:100%;align-items:center}
#crPrev{flex:none;width:38%;display:flex;flex-direction:column;align-items:center;gap:6px}
#crCv{width:min(44vh,240px);height:min(44vh,240px);image-rendering:pixelated;background:radial-gradient(circle,#24402e,#0b120e 70%);border-radius:50%;border:3px solid var(--line)}
#crPort{width:min(22vh,120px);height:min(24vh,132px);image-rendering:pixelated;border:3px solid var(--line);border-radius:10px;background:#0b120e}
#crOpts{flex:1;max-height:100%;overflow:auto;padding-right:4px}
#crOpts .crTabs{display:flex;gap:6px;margin:2px 0 8px}#crOpts .crTabs button{flex:1;font-family:'Nunito';font-weight:900;letter-spacing:.5px;font-size:14px;padding:9px 4px;border-radius:9px;border:2px solid var(--line);background:#0e1a13;color:#cfe;cursor:pointer}#crOpts .crTabs button.on{background:#1f8a4c;color:#fff;border-color:#46ff95}
#crOpts h2{font-family:'Nunito';font-weight:900;letter-spacing:.5px;font-size:17px;color:var(--green);margin:4px 0 8px}
.opt{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:15px}
.opt label{width:92px;color:var(--muted);flex:none}
.opt .val{flex:1;text-align:center;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:5px;font-size:15px}
.opt .arr{width:36px;height:34px;border-radius:8px;background:var(--panel2);border:2px solid var(--line);font-size:16px}
.sw{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sw button{width:28px;height:28px;border-radius:7px;border:2px solid #000;box-shadow:0 0 0 2px transparent}
.sw button.on{box-shadow:0 0 0 2px var(--green)}
.opt input{flex:1;font-family:inherit;font-size:16px;background:#0b110d;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:6px 10px;-webkit-user-select:text;user-select:text}
#rotate{position:fixed;inset:0;z-index:999;background:#050806;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;font-size:18px}
#rotate .ph{width:60px;height:100px;border:4px solid var(--green);border-radius:12px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#loading{position:fixed;inset:0;z-index:100;background:#050806;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;color:var(--muted)}
#loading .bar{width:220px;height:8px;border:2px solid var(--line);border-radius:6px;overflow:hidden}
#loading .bar b{display:block;height:100%;width:0;background:var(--green);transition:width .2s}

#cine{z-index:70 !important}#cine .cbar{position:absolute;left:0;right:0;height:9%;background:#000;z-index:2}#cine .cbar.top{top:0}#cine .cbar.bot{bottom:0}
#cineCap{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(86%,760px);z-index:3;text-align:center;opacity:0;transition:opacity .25s;
  font-size:clamp(14px,2.3vw,19px);line-height:1.4;color:#f4f1e8;text-shadow:0 2px 4px #000,0 0 10px #000;background:linear-gradient(transparent,rgba(0,0,0,.55) 30%,rgba(0,0,0,.55) 70%,transparent);padding:8px 16px}
#cineCap.on{opacity:1}#cineCap b{display:block;font-family:'Nunito';font-weight:900;letter-spacing:.5px;font-size:clamp(13px,2vw,16px);margin-bottom:4px;letter-spacing:1px}#cineCap.narr span{font-style:italic;color:#e0e6dc}
#cineSkip{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:4;background:rgba(0,0,0,.55);color:#cfe;border:1px solid #46ff9566;border-radius:8px;padding:6px 12px;font-size:13px;font-family:inherit}
.sockrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}.sockrow b{min-width:58px}.sock{border:1px dashed #3a5a46;border-radius:7px;padding:3px 8px;font-size:13px;color:#8aa}.sock.on{border-style:solid;color:#e8fff0}.sock.small{border-color:#7fe8a8}.sock.medium{border-color:#ffd88a}.stat.lore.locked{opacity:.55}.grade{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:1px 6px;border-radius:7px;font-family:'Press Start 2P';font-size:11px;color:#0b120e;background:var(--gc);box-shadow:0 0 8px var(--gc)}
.gbar{height:8px;background:#0e1a13;border-radius:5px;overflow:hidden;margin:6px 0;border:1px solid #2f5a40}.gbar i{display:block;height:100%}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.branch h4{margin:2px 0 6px;color:var(--green);font-family:'Nunito';font-weight:900;letter-spacing:.5px;font-size:14px}
.node{border:1px solid #2f5a40;border-radius:9px;padding:7px;margin-bottom:6px;display:flex;flex-direction:column;gap:4px;font-size:13px}.node b{color:#e8fff0}.node span{color:#9ab8a6}.node em{font-style:normal;font-size:12px;color:#7a9}
.node.got{border-color:#46ff95;background:#123a22}.node.locked{opacity:.5}.node .btn{padding:4px 8px;font-size:12px}
/* ---------- battle command strip (v3): the fight sits above, decisions live below ---------- */
#bstrip{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(180deg,#101c15,#070c09);border-top:2px solid #2f6b43;box-shadow:0 -6px 18px rgba(0,0,0,.5);pointer-events:none}
#timeline{bottom:calc(92px + 6px)!important}
#bcmd{position:absolute;left:max(8px,env(safe-area-inset-left));right:calc(max(8px,env(safe-area-inset-right)) + 4px);bottom:max(4px,env(safe-area-inset-bottom));transform:none;width:auto;height:84px;display:block}
#cmdBox{height:100%;display:flex;flex-direction:column;gap:4px;background:none;border:0;box-shadow:none;padding:2px 0 0}
#cmdTip{display:flex;align-items:center;gap:8px;height:22px;min-height:0;padding:0 4px;margin:0;border:0;font-size:12.5px;line-height:22px;color:#b8d0c0}
#cmdTipT{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdCost{position:static;display:none;flex:none;padding:0 9px;height:18px;line-height:18px;border-radius:999px;background:#12304a;border:1px solid #3d7fb8;color:#9fd8ff;font-size:11px;font-weight:800;white-space:nowrap}
#cmdCost.on{display:block}
#cmdList{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;scroll-behavior:smooth;grid-template-rows:1fr;gap:6px;padding:0 0 2px;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cmdList::-webkit-scrollbar{display:none}
#cmdList button{display:flex;align-items:center;gap:7px;text-align:left;height:100%;padding:0 8px 0 5px;font-size:13.5px;font-weight:800;color:#eaf5ee;background:linear-gradient(180deg,#1d3024,#142019);border:1.5px solid #2c4a37;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .06s,border-color .1s,background .1s}
#cmdList button .ic{flex:none;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--cc,#2c4a37);color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#cmdList button{min-width:104px}
#cmdList button .lb{flex:1;white-space:nowrap}
#cmdBox{position:relative}
#cmdBox.more::after{content:'›';position:absolute;right:0;bottom:2px;height:calc(100% - 28px);width:34px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font:900 22px Nunito;color:#7dffb0;background:linear-gradient(90deg,rgba(7,12,9,0),#070c09 70%);pointer-events:none;border-radius:0 8px 8px 0}
#cmdBox.less::before{content:'‹';position:absolute;left:0;bottom:2px;height:calc(100% - 28px);width:30px;z-index:1;display:flex;align-items:center;padding-left:4px;font:900 22px Nunito;color:#7dffb0;background:linear-gradient(270deg,rgba(7,12,9,0),#070c09 70%);pointer-events:none}
#cmdList button small{flex:none;font-size:10.5px;font-weight:800;margin:0;opacity:1;color:#9fd8ff}
#cmdList button.sel{border-color:var(--cc,#46ff95);background:linear-gradient(180deg,#24432f,#183224);box-shadow:0 0 0 1px var(--cc,#46ff95),0 2px 0 rgba(0,0,0,.5)}
#cmdList button.sel:before{content:none}
#cmdList button.press{transform:scale(.96);background:#2a4a36}
#cmdList button:disabled{opacity:.38;filter:grayscale(.6)}
#cmdDesc{display:none!important}
#react{bottom:max(-2px,env(safe-area-inset-bottom))!important}
.rx{width:84px!important;height:84px!important}
#tgtHint{bottom:30px!important}
</style>

<script>
/* if anything breaks while starting up, say so on screen instead of hanging */
(function(){
  var shown=false, errs=[];
  function box(msg){
    var d=document.getElementById('bootErr');
    if(!d){d=document.createElement('div');d.id='bootErr';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#2a0d0d;border:2px solid #ff6a6a;border-radius:10px;padding:10px 12px;color:#fff;font:600 13px/1.35 -apple-system,system-ui,sans-serif;max-height:45vh;overflow:auto';document.body.appendChild(d);}
    d.innerHTML='<b style="color:#ff9a9a">Something went wrong starting the game.</b><br><span style="opacity:.85">Screenshot this and send it to Claude.</span><pre style="white-space:pre-wrap;font:12px/1.3 ui-monospace,monospace;margin:6px 0">'+msg.replace(/</g,'&lt;')+'</pre><button onclick="location.reload()" style="padding:6px 14px;border-radius:8px;border:0;background:#46ff95;font-weight:800">Reload</button> <button onclick="try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});caches&&caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}catch(e){};setTimeout(function(){location.reload()},600)" style="padding:6px 14px;border-radius:8px;border:0;background:#ffd36a;font-weight:800">Clear cache &amp; reload</button>';
  }
  function add(m){ try{ if(!(window.G&&G.mode&&G.mode!=='boot') && !sessionStorage.getItem('ebRetry')){ sessionStorage.setItem('ebRetry','1'); setTimeout(function(){location.reload();},300); return; } }catch(_){} errs.push(m); if(errs.length>4) errs.shift(); if(window.G&&G.mode&&G.mode!=='boot') return; box(errs.join('\n')); shown=true; }
  window.addEventListener('error',function(e){ var t=e.target; if(t&&t.tagName==='SCRIPT'){ add('could not download '+(t.src||'').split('/').pop()); return; } },true);
  window.addEventListener('error',function(e){ add((e.message||'error')+' @ '+(e.filename||'').split('/').pop()+':'+(e.lineno||'')); });
  window.addEventListener('unhandledrejection',function(e){ add('promise: '+(e.reason&&(e.reason.message||e.reason))); });
  setTimeout(function(){ if(window.G&&G.mode==='boot'){ var t=document.getElementById('loadTxt'); add('Still loading after 25s — stuck at: '+(t?t.textContent:'?')+' ('+(document.getElementById('loadBar')||{style:{}}).style.width+')'); } },25000);
})();
</script>
