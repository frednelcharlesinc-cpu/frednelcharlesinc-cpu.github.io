<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a0e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crow Vault">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Crow Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column over a living storm canvas; fixed bottom tab bar; bottom sheets for every form. Single dark look by design. */
:root{
  --ink:#0c0a0e;        /* night sky */
  --smoke:#17141b;      /* panels */
  --smoke-2:#211c26;    /* raised */
  --ash:#3a3240;        /* lines */
  --bone:#eee7dc;       /* text */
  --dim:#a89fa8;        /* secondary text */
  --blood:#e0302f;      /* red lightning accent */
  --ember:#ff7a52;
  --maroon:#7b2230;     /* his pants */
  --chakra:#58b8ff;     /* blue energy, used for money in */
  --jade:#53d391;       /* good */
  --amber:#f2b33d;      /* warning */
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"M PLUS 1p","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--ink);color:var(--bone);margin:0}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
.splitrow input{font-size:16px}
body{font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%;overflow-x:hidden}
#storm{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.05rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);font-weight:700}
.muted{color:var(--dim)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:color-mix(in srgb,var(--smoke) 88%,transparent);border:1px solid var(--ash);border-radius:var(--r);padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.section{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.btn{border:1px solid var(--ash);background:var(--smoke-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.85rem;white-space:nowrap}
.btn:hover{border-color:var(--blood)}
.btn.red{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:.78rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--ash);color:var(--dim);white-space:nowrap}
.chip.red{color:var(--blood);border-color:color-mix(in srgb,var(--blood) 55%,transparent)}
.chip.amber{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.chip.jade{color:var(--jade);border-color:color-mix(in srgb,var(--jade) 50%,transparent)}
.chip.blue{color:var(--chakra);border-color:color-mix(in srgb,var(--chakra) 50%,transparent)}
.pos{color:var(--jade)}.neg{color:var(--blood)}.inc{color:var(--chakra)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:4px}
.brand{display:flex;align-items:center;gap:8px}
.brand .kanji{font-family:var(--display);color:var(--blood);font-size:1.3rem;text-shadow:0 0 12px color-mix(in srgb,var(--blood) 70%,transparent)}
.brand h1{font-size:1.15rem}
.sync{font-size:.7rem}

/* hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;margin-top:10px}
.avatar{position:relative;width:132px;height:150px;cursor:pointer;background:none;border:0;padding:0}
.avatar svg.chibi{position:relative;z-index:2;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.avatar .aura{position:absolute;inset:-6px -10px 0;z-index:1;pointer-events:none}
.avatar .aura path{fill:none;stroke:var(--blood);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--blood));opacity:0}
@media (prefers-reduced-motion:no-preference){
  .avatar .aura path{animation:crackle 3.2s infinite steps(1)}
  .avatar .aura path:nth-child(2){animation-delay:.4s}
  .avatar .aura path:nth-child(3){animation-delay:1.1s}
  .avatar .aura path:nth-child(4){animation-delay:1.9s}
  .avatar .aura path:nth-child(5){animation-delay:2.5s}
  .avatar.surge .aura path{animation-duration:.5s}
  .chibi .bob{animation:bob 3.6s ease-in-out infinite;transform-origin:60px 120px}
  .chibi .steam path{animation:steam 2.4s ease-in-out infinite}
  .chibi .steam path:nth-child(2){animation-delay:1.2s}
}
@keyframes crackle{0%{opacity:0}6%{opacity:1}9%{opacity:.2}12%{opacity:.9}18%{opacity:0}100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-8px)}}
.bubble{position:relative;background:var(--bone);color:var(--ink);border-radius:14px;padding:10px 12px;font-weight:500;font-size:.88rem;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--bone);border-left:0}
.bubble b{font-weight:700}
.rank{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}

/* balance */
.bal{margin-top:16px;position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--blood) 22%,transparent),transparent 70%);pointer-events:none}
.bal .big{font-family:var(--mono);font-size:2.2rem;font-weight:700;line-height:1.1;letter-spacing:-.02em;background:none;border:0;padding:0;text-align:left}
.bal .big:hover{color:var(--ember)}
.free{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--ash);align-items:baseline}
.free .v{font-family:var(--mono);font-size:1.3rem;font-weight:700}
.pots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.pot{background:var(--smoke-2);border:1px solid var(--ash);border-radius:10px;padding:10px 12px;text-align:left;min-width:0}
.pot .v{font-family:var(--mono);font-weight:700;font-size:1.05rem}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.quick button{background:var(--smoke-2);border:1px solid var(--ash);border-radius:12px;padding:10px 4px;font-size:.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button:hover{border-color:var(--blood)}
.quick svg{width:22px;height:22px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--ash);align-items:center}
.item:last-child{border-bottom:0}
.item .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .sub{font-size:.78rem;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .amt{font-family:var(--mono);font-weight:700;text-align:right}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.item.tap{cursor:pointer}
.empty{padding:16px;border:1px dashed var(--ash);border-radius:12px;color:var(--dim);font-size:.88rem;text-align:center}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--ash) 60%,transparent);align-items:center;font-size:.86rem}
.tl .d{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.tl .run{font-family:var(--mono);font-size:.78rem;text-align:right}
.tl .ev.short{background:color-mix(in srgb,var(--blood) 12%,transparent)}
.tl .lbl{min-width:0;overflow-wrap:anywhere}

/* meters */
.meter{height:10px;border-radius:999px;background:var(--smoke-2);border:1px solid var(--ash);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--jade);transition:width .5s}
.meter.warn i{background:var(--amber)}.meter.over i{background:var(--blood)}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.donut{width:150px;height:150px;position:relative}
.donut svg{width:100%;height:100%;overflow:visible}
.donut path{cursor:pointer;transition:transform .15s,opacity .15s;stroke:var(--smoke);stroke-width:2}
.donut path.dim{opacity:.35}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:30px}
.donut .center .v{font-family:var(--mono);font-weight:700;font-size:.95rem}
.donut .center .l{font-size:.68rem;color:var(--dim);line-height:1.2;overflow-wrap:anywhere}
.legend{display:flex;flex-direction:column;gap:4px;min-width:0}
.legend button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:3px 4px;border-radius:6px;font-size:.8rem;text-align:left}
.legend button:hover,.legend button.on{background:var(--smoke-2)}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* bars */
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--chakra),color-mix(in srgb,var(--chakra) 40%,var(--ink)));min-height:2px}
.bars .b.best i{background:linear-gradient(var(--ember),var(--blood))}
.bars .b span{font-size:.65rem;color:var(--dim)}
.bars .b em{font-style:normal;font-family:var(--mono);font-size:.62rem}

/* lesson */
.lesson h3{font-size:1.1rem;margin-bottom:6px}
.lesson p{margin:6px 0;max-width:65ch}
.lesson .tag{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blood)}
.lesson .do{background:var(--smoke-2);border-left:3px solid var(--blood);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.riddle{margin-top:12px;padding:12px;border:1px dashed var(--maroon);border-radius:10px}
.skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--smoke-2),var(--ash),var(--smoke-2));background-size:200% 100%;animation:sh 1.4s linear infinite;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--ink) 92%,transparent);border-top:1px solid var(--ash);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;color:var(--dim)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--bone)}
.tabs button[aria-current="page"] svg{color:var(--blood);filter:drop-shadow(0 0 6px var(--blood))}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow:auto;background:var(--smoke);border-top:2px solid var(--blood);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet h2{font-size:1.15rem;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.75rem;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.field input,.field select{background:var(--ink);border:1px solid var(--ash);border-radius:10px;padding:11px 12px;width:100%;font-size:1rem}
.field input:focus,.field select:focus{border-color:var(--blood);outline:none}
.field .hint{font-size:.75rem;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .foot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap}
.warnbox{background:color-mix(in srgb,var(--blood) 14%,transparent);border:1px solid var(--blood);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--bone);color:var(--ink);font-weight:700;padding:9px 16px;border-radius:999px;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--blood) 35%,transparent),transparent 60%);opacity:0;transition:opacity .4s}
.flash.on{opacity:1;transition:none}
.goal .meter{margin-top:6px}
.splitrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 90px;gap:8px;align-items:center;margin-bottom:8px}
.splitrow input{background:var(--ink);border:1px solid var(--ash);border-radius:8px;padding:8px;width:100%}
.setup h2{font-size:1.4rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button.on{background:var(--blood);border-color:var(--blood);color:#fff}
/* ===== v2: app feel ===== */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
button,[data-act],.tabs button{touch-action:manipulation}
.btn,.quick button,.pot,.tabs button,.chipbtn{transition:transform .12s ease,border-color .15s}
.btn:active,.quick button:active,.pot:active,.tabs button:active,.chipbtn:active{transform:scale(.95)}
#view.enter{animation:viewIn .28s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scrim{animation:fadeIn .2s ease-out}
.sheet{animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.08)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--ash);margin:-6px auto 12px}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){#view.enter,.sheet,.scrim{animation:none}}
.msgcard{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.msgcard .bubble::before{display:none}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:22;width:60px;height:60px;border-radius:50%;border:0;background:var(--blood);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px color-mix(in srgb,var(--blood) 30%,transparent),0 8px 22px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--blood) 65%,transparent);transition:transform .12s}
.fab svg{width:30px;height:30px}
.fab:active{transform:scale(.9)}
.amtbig{font-family:var(--mono);font-size:2.4rem;font-weight:700;background:var(--ink);border:1px solid var(--ash);border-radius:14px;padding:10px 14px;width:100%;text-align:center;color:var(--bone)}
.amtbig:focus{border-color:var(--blood);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--ash);background:var(--smoke-2);border-radius:999px;padding:8px 13px;font-weight:700;font-size:.84rem}
.chipbtn.on{background:var(--blood);border-color:var(--blood);color:#fff}
.chipbtn small{font-family:var(--mono);font-weight:500;opacity:.8;margin-left:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ash);border-radius:12px;overflow:hidden}
.seg button{background:var(--ink);border:0;padding:11px 6px;font-weight:700;font-size:.85rem;color:var(--dim)}
.seg button.on{background:var(--smoke-2);color:var(--bone);box-shadow:inset 0 -3px 0 var(--blood)}
.qlabel{font-size:.75rem;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.vault{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--maroon) 50%,var(--smoke-2)),var(--smoke-2));border-color:color-mix(in srgb,var(--blood) 45%,var(--ash))}
.vault .v{font-size:1.25rem}
.plan .step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--ash);align-items:start}
.plan .step:last-child{border-bottom:0}
.plan .tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--ash);background:transparent;display:grid;place-items:center;padding:0;color:#fff;font-weight:700}
.plan .step.done .tick{background:var(--jade);border-color:var(--jade)}
.plan .step.done .t{text-decoration:line-through;color:var(--dim)}
.plan .t{font-weight:700}
.plan .w{font-size:.83rem;color:var(--dim)}
#buddy{position:fixed;left:0;top:0;z-index:45;width:84px;height:98px;pointer-events:none;will-change:transform}
#buddy .bb{position:absolute;inset:0;pointer-events:auto;touch-action:none;cursor:grab;transform-origin:50% 90%}
#buddy .body{position:absolute;inset:0;z-index:2}
#buddy .body svg.chibi{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.65))}
#buddy .aura{position:absolute;left:-30px;top:-26px;width:144px;height:134px;z-index:1;pointer-events:none}
#buddy .aura path{fill:none;stroke:var(--blood);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--blood)) drop-shadow(0 0 2px #fff);opacity:0}
#buddy .say{position:absolute;left:0;bottom:calc(100% + 8px);width:max-content;max-width:min(240px,72vw);background:var(--bone);color:var(--ink);font-weight:500;font-size:.86rem;line-height:1.35;padding:9px 12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.55);opacity:0;transform:translateY(6px) scale(.92);transition:opacity .2s,transform .2s;pointer-events:none}
#buddy .say.on{opacity:1;transform:none}
#buddy.below .say{bottom:auto;top:calc(100% + 6px)}
#buddy .say b{font-weight:700}
@media (prefers-reduced-motion:no-preference){
 #buddy .aura path{animation:crackle 2.6s infinite steps(1)}
 #buddy .aura path:nth-child(2){animation-delay:.35s}#buddy .aura path:nth-child(3){animation-delay:.9s}#buddy .aura path:nth-child(4){animation-delay:1.5s}#buddy .aura path:nth-child(5){animation-delay:2s}#buddy .aura path:nth-child(6){animation-delay:1.2s}
 #buddy.surge .aura path{animation-duration:.45s}
 #buddy .emo-hop{animation:hop .5s ease-out 2}
 #buddy .emo-shake{animation:shake .4s ease-in-out 2}
 #buddy .emo-spin{animation:spin .7s ease-in-out}
 #buddy .emo-droop{animation:droop 1.4s ease-in-out}
}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) scale(1.05,.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-7deg)}75%{transform:translateX(6px) rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes droop{0%,100%{transform:none}40%,70%{transform:translateY(6px) scaleY(.93)}}
#splash{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;place-items:center;transition:opacity .45s}

    let glow=0;if(bolt){const age=t-bolt.t;glow=Math.max(0,1-age/750)*(age>110&&age<190?.3:1);if(age>750)bolt=null}if(glow){x.fillStyle=`rgba(224,48,47,${glow*.09})`;x.fillRect(0,0,W,H)}
    for(const c of clouds){if(!reduce)c.x+=c.v*dt;if(c.x>1.3)c.x=-.3;cloud(c.x*W,c.y*H,c.s,c.seed,glow)}
    if(bolt){const a=glow;const line=P=>{x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()};x.save();x.lineJoin="round";x.lineCap="round";
      x.shadowColor="#ff2a2a";x.shadowBlur=44;x.strokeStyle=`rgba(224,48,47,${a*.35})`;x.lineWidth=18;line(bolt.pts);

      x.shadowBlur=8;x.strokeStyle=`rgba(255,240,235,${a})`;x.lineWidth=2;line(bolt.pts);x.lineWidth=1.1;bolt.br.forEach(line);x.restore()}
    for(const o of crows){if(!reduce){o.x+=o.v*dt;o.y+=o.dy*dt}if(o.x>1.1)Object.assign(o,newCrow(false));crow(o,reduce?0:t)}
    if(!reduce&&t>nextBolt){bolt=makeBolt();nextBolt=t+3500+Math.random()*6500}
    if(!reduce)requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  window.__strike=()=>{if(!reduce){bolt=makeBolt();bolt.t=performance.now()}const f=$("#flash");f.classList.add("on");setTimeout(()=>f.classList.remove("on"),60)};
}

function nextPayday(){
  const p=S.sources.filter(x=>x.kind==="pay"&&x.next&&x.freq!=="variable").map(x=>x.next).sort();
  const t=today();const fut=p.filter(d=>d>=t);return fut[0]||p[0]||null;
}
function txIn(range){return S.tx.filter(range)}
function monthTx(m){return S.tx.filter(t=>monthKey(t.d)===m)}
function groceryWeek(){const ws=weekStart(today());return S.tx.filter(t=>t.type==="out"&&t.cat==="Groceries"&&t.d>=ws).reduce((a,t)=>a+t.amount,0)}
function project(days=30){
  const t=today(),end=addDays(t,days),ev=[];
  for(const s of S.sources){if(!s.next||s.freq==="variable"||!(s.amount>0))continue;let d=s.next,late=d<t;if(late)ev.push({d:t,name:s.name,amt:s.amount,type:"in",note:"expected, not logged yet"}),d=advance(d,s.freq);let g=0;while(d&&d<=end&&g++<60){ev.push({d,name:s.name,amt:s.amount,type:"in"});if(s.freq==="once")break;d=advance(d,s.freq)}}
  for(const b of S.bills){if(!b.next||!(b.amount>0))continue;let d=b.next;if(d<t){ev.push({d:t,name:b.name,amt:b.amount,type:"out",overdue:true});d=advance(d,b.freq)}let g=0;while(d&&d<=end&&g++<60){ev.push({d,name:b.name,amt:b.amount,type:"out"});if(b.freq==="once")break;d=advance(d,b.freq)}}
  if(S.grocery.weekly>0){const left=Math.max(0,S.grocery.weekly-groceryWeek());if(left>0)ev.push({d:t,name:"Groceries left this week",amt:left,type:"out",budget:true});let d=addDays(weekStart(t),7);while(d<=end){ev.push({d,name:"Groceries (weekly budget)",amt:S.grocery.weekly,type:"out",budget:true});d=addDays(d,7)}}
  ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.type==="out"?-1:1));
  let run=S.bank;for(const e of ev){run+=e.type==="in"?e.amt:-e.amt;e.run=run}
  return ev;
}
function freeToSpend(){
  const p=nextPayday();const t=today();const lim=p&&p>t?p:addDays(t,14);
  const due=project(45).filter(e=>e.type==="out"&&e.d<lim).reduce((a,e)=>a+e.amt,0);
  return{amount:S.bank-due,until:lim,due,hasPay:!!(p&&p>t)};
}
function streak(){

}

/* ---------- donut ---------- */
function donut(id,items,centerLabel){
  items=items.filter(i=>i.v>0).sort((a,b)=>b.v-a.v);
  const total=items.reduce((a,i)=>a+i.v,0);
  if(!total)return `<div class="empty">Nothing to chart yet.</div>`;
  let a0=-Math.PI/2;const R=70,r=44,cx=75,cy=75;
  const segs=items.map((it,i)=>{const frac=it.v/total;const a1=a0+frac*Math.PI*2-(items.length>1?0.012:0);const large=a1-a0>Math.PI?1:0;
    const p=(ang,rad)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
    let d;if(items.length===1){d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`}
    else{const[x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);d=`M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z`}
    const mid=(a0+a1)/2;a0=a1+(items.length>1?0.012:0);
    return{d,color:it.color||PALETTE[i%PALETTE.length],mid,...it,pct:frac}});
  return `<div class="donut-wrap" data-donut="${id}" data-total="${total}" data-label="${esc(centerLabel)}">
    <div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="${esc(centerLabel)}">${segs.map((s,i)=>`<path d="${s.d}" fill="${s.color}" data-i="${i}" data-n="${esc(s.n)}" data-v="${s.v}" data-p="${s.pct}" data-mx="${Math.cos(s.mid)*5}" data-my="${Math.sin(s.mid)*5}" tabindex="0"><title>${esc(s.n)}: ${money(s.v)}</title></path>`).join("")}</svg>
    <div class="center"><span class="v">${moneyR(total)}</span><span class="l">${esc(centerLabel)}</span></div></div>
    <div class="legend">${segs.map((s,i)=>`<button type="button" data-i="${i}"><i style="background:${s.color}"></i><span class="n">${esc(s.n)}</span><span class="num muted">${Math.round(s.pct*100)}%</span></button>`).join("")}</div></div>`;
}
function wireDonuts(){
  document.querySelectorAll("[data-donut]").forEach(w=>{
    const paths=[...w.querySelectorAll("path")],leg=[...w.querySelectorAll(".legend button")],cv=w.querySelector(".center .v"),cl=w.querySelector(".center .l");
    const reset=()=>{paths.forEach(p=>{p.classList.remove("dim");p.style.transform=""});leg.forEach(b=>b.classList.remove("on"));cv.textContent=moneyR(+w.dataset.total);cl.textContent=w.dataset.label};
    const hi=i=>{paths.forEach((p,j)=>{p.classList.toggle("dim",j!=i);p.style.transform=j==i?`translate(${p.dataset.mx}px,${p.dataset.my}px)`:""});leg.forEach((b,j)=>b.classList.toggle("on",j==i));const p=paths[i];cv.textContent=money(+p.dataset.v);cl.textContent=p.dataset.n+" · "+Math.round(p.dataset.p*100)+"%"};
    let pinned=null;
    [...paths,...leg].forEach(el=>{const i=+el.dataset.i;
      el.addEventListener("pointerenter",()=>{if(pinned===null)hi(i)});
      el.addEventListener("pointerleave",()=>{if(pinned===null)reset()});
      el.addEventListener("focus",()=>hi(i));el.addEventListener("blur",()=>{if(pinned===null)reset()});
      el.addEventListener("click",e=>{e.stopPropagation();if(pinned===i){pinned=null;reset()}else{pinned=i;hi(i)}});
    });
  });
}

/* reverse any entry (used by delete and undo) */
function reverseTx(x){const a=x.amount;
  if(x.type==="in"){if(x.dest==="cash")S.cash.balance-=a;else S.bank-=a}
  else if(x.type==="out"){if(x.src==="cash")S.cash.balance+=a;else S.bank+=a}
  else if(x.cat==="To trading"){S.bank+=a;S.trading.balance-=a;S.trading.basis-=a}
  else if(x.cat==="From trading"){S.bank-=a;S.trading.balance+=a;S.trading.basis+=a}
  else if(x.cat==="To savings"){S.bank+=a;const g=S.goals.find(g=>g.id===x.goal);if(g)g.saved=Math.max(0,g.saved-a)}
  else if(x.cat==="To cash vault"){S.bank+=a;S.cash.balance-=a}
  else if(x.cat==="Cash stash"){S.cash.balance-=a}
  else if(x.cat==="From cash vault"){S.bank-=a;S.cash.balance+=a}
}

function logOut(o){const cash=o.src==="cash";
  if(cash&&o.amount>S.cash.balance+.001){toast(`Cash vault only has ${money(S.cash.balance)}. Put cash in first or pay from bank.`);say("The vault doesn't have that much cash. Count it?","shock");return false}
  if(cash)S.cash.balance-=o.amount;else S.bank-=o.amount;
  const x={id:uid(),type:"out",cat:o.cat,amount:o.amount,note:o.note,d:o.d||today()};if(cash)x.src="cash";S.tx.push(x);commit();vibe();reactSpend(x);
  toastUndo(`Logged ${money(o.amount)} · ${o.note}`,()=>{reverseTx(x);S.tx=S.tx.filter(t=>t!==x);commit();say("Undone. Like it never happened.","calm")});
  return true}
function reactSpend(x){const{spent,cap,f}=todayNums();const same=S.tx.filter(y=>y.type==="out"&&y.d===today()&&y.cat===x.cat).length;
  if(x.d!==today())say(`Logged for ${fdShort(x.d)}.`,"calm");
  else if(f.amount<0)say(pickL("broke").replace("{n}",moneyR(-f.amount)),"sad",true);
  else if(spent>cap)say(`Over today's safe spend by <b>${moneyR(spent-cap)}</b>. ${pickL("disappointed")}`,"sad");
  else if(same>=3)say(`That's ${same} times on <b>${esc(x.cat)}</b> today. Just saying.`,"think");
  else say(`Logged. <b>${moneyR(cap-spent)}</b> left of today's safe spend. ${pickL("goodSpend")}`,"happy")}

function offDayCard(){const t=today();

function planFor(t,seed){
  const f=freeToSpend(),h=hashStr(t+":"+seed),pick=(a,k)=>a[(h+k*7)%a.length];
  const cap=f.amount<=0?0:Math.round(Math.min(f.amount*.12,150));
  const steps=[];
  steps.push(pick([{id:"rest",t:"Sleep in. No alarm.",w:"You close late. Recovery isn't lazy, it's part of the grind."},{id:"rest",t:"Slow morning: water first, phone later",w:"Give your head 30 minutes before the world gets it."}],0));
  const due=S.bills.filter(b=>b.next&&b.amount>0&&daysBetween(t,b.next)<=4).sort((a,b)=>a.next<b.next?-1:1)[0];
  const bak=!S.lastBackup||daysBetween(S.lastBackup,t)>7;
  steps.push(due?{id:"money",t:`Handle ${due.name} (${money(due.amount)})`,w:`Due ${fdShort(due.next)}. Pay it today while you have time, then tap Paid.`}
    :bak?{id:"money",t:"Back up your vault",w:"Sensei → Settings → Back up now. Your data only lives on this phone."}
    :{id:"money",t:"5-minute money check",w:"Log any tips you missed and count your cash vault so the app matches real life."});
  const gl=S.grocery.weekly?Math.max(0,S.grocery.weekly-groceryWeek()):0;
  steps.push(pick([{id:"reset",t:"Cook for the week",w:S.grocery.weekly?`Batch 3–4 meals for your shifts. ${moneyR(gl)} left in this week's grocery budget.`:"Batch 3–4 meals for your shifts. Every home meal is food-out money saved."},{id:"reset",t:"Reset your space",w:"Laundry, clean room, work clothes ready. Off-day you sets up work-week you."}],1));
  steps.push(pick([{id:"grow",t:"30 minutes of chart practice",w:"Mark support and resistance on 3 charts. Study only, no trades today."},{id:"grow",t:"Send 2 job applications",w:"Or follow up on one you already sent. Small moves stack."},{id:"grow",t:"Move for 30 minutes",w:"Beach walk, run or workout. Free, and it clears your head."},{id:"grow",t:"Do today's lesson",w:"Open Sensei, read it, do the one action it gives you."}],2));
  steps.push(cap<=0?{id:"fun",t:"Free fun only today",w:"Bills before payday need every dollar. Beach, sunset, good people: all free."}
    :cap<30?{id:"fun",t:`Fun budget: ${moneyR(cap)}`,w:pick(["Beach day. Bring drinks and snacks from home.","Cook something new and invite someone over.","Sunset walk, then movie night at home."],3)}
    :{id:"fun",t:`Fun budget: ${moneyR(cap)}`,w:pick(["Go out to eat or hit a local spot. Log it with the red + so it counts.","Treat yourself to one thing you've been waiting on. One thing, not three.","Plan a day out with someone you care about. Keep it under the cap."],3)});
  steps.push({id:"prep",t:"Prep for your next shift",w:"Work clothes out, food packed, and a decent bedtime if you're back on tomorrow."});
  return{cap,steps}}
function planBody(){const t=today();if(!S.offPlan||S.offPlan.d!==t)S.offPlan={d:t,seed:0,done:[]};const p=planFor(t,S.offPlan.seed),done=S.offPlan.done,n=p.steps.filter(s=>done.includes(s.id)).length;
  return `<div class="row between" style="margin-bottom:4px;flex-wrap:wrap"><span class="muted" style="font-size:.84rem">${p.cap>0?`Spend cap today: <b class="num" style="color:var(--bone)">${moneyR(p.cap)}</b>. Bills stay covered.`:"No-spend day. Bills need it."}</span><span class="chip ${n===p.steps.length?"jade":""}">${n}/${p.steps.length}</span></div>
  ${p.steps.map(s=>`<div class="step ${done.includes(s.id)?"done":""}"><button type="button" class="tick" data-act="offTick" data-id="${s.id}" aria-label="Mark done">${done.includes(s.id)?"✓":""}</button><div style="min-width:0"><div class="t">${esc(s.t)}</div><div class="w">${esc(s.w)}</div></div></div>`).join("")}`}

   S.tx=S.tx.filter(t=>t!==x);commit();toast("Entry deleted")},
 hf:el=>{histFilter=el.dataset.k;render()},
 newLesson:()=>{const l=makeLesson(String(Math.random()));S.lessons=S.lessons.filter(x=>x.d!==today());S.lessons.push(l);commit();say("Fresh lesson. Read it slow.","think")},
 reveal:()=>{const l=S.lessons.at(-1);l.shown=!l.shown;render()},
 currency:()=>openSheet("Currency symbol",txt("f-c","Symbol",cur(),"$"),()=>{S.currency=V("f-c").trim().slice(0,3)||"$";commit()}),
 reset:()=>openSheet("Start over","<p>This erases every balance, bill, income source and entry on this phone. Back up first if you might want it later.</p>",()=>{S=null;save();render()},{submitLabel:"Erase everything"}),
 backup:()=>doBackup(),
 restore:()=>{const i=$("#restoreFile");i.value="";i.click()},
 installHelp:()=>deferredInstall?(deferredInstall.prompt(),deferredInstall=null):openSheet("Put it on your home screen",installSteps(),()=>{},{submitLabel:"Got it"}),
 avatar:()=>Buddy.tap()
};
function fundGoal(g,a){S.bank-=a;g.saved=(g.saved||0)+a;addTx({type:"move",cat:"To savings",amount:a,note:"Savings · "+g.name,goal:g.id});
  const p=g.target?g.saved/g.target:0;const prev=g.target?(g.saved-a)/g.target:0;
  const hit=[.25,.5,.75,1].find(m=>prev<m&&p>=m);if(hit){say(hit>=1?`<b>${esc(g.name)}</b> complete. Goal crushed.`:`<b>${esc(g.name)}</b> is ${hit*100}% there. Keep going.`,"happy",true);window.__strike?.()}}
function splitSheet(pay){
  const sv=Math.round(pay*S.split.save)/100,tr=Math.round(pay*S.split.trade)/100;
  const gopts=S.goals.map(g=>[g.id,g.name]);
  openSheet("Pay yourself first",`<p class="muted" style="margin:0 0 12px;font-size:.88rem">Paycheck of ${money(pay)}. Move these now, before spending anything.</p>
   <div class="splitrow"><label for="sp-s"><b>Savings</b>${gopts.length?"":`<br><span class="muted" style="font-size:.75rem">add a goal in Sensei first</span>`}</label><span class="muted">${S.split.save}%</span><input id="sp-s" type="number" step="0.01" min="0" value="${gopts.length?sv:0}" ${gopts.length?"":"disabled"}></div>
   ${gopts.length?sel("sp-g","Into goal",gopts,gopts[0][0]):""}
   <div class="splitrow"><label for="sp-t"><b>Trading</b></label><span class="muted">${S.split.trade}%</span><input id="sp-t" type="number" step="0.01" min="0" value="${tr}"></div>
   <div id="limWarn"></div>`,()=>{
    const s=N("sp-s"),t=N("sp-t");
    if(t>0&&S.trading.limit&&tradingMonthDeposits()+t>S.trading.limit&&!$("#sheetOk").dataset.armed){$("#limWarn").innerHTML=`<div class="warnbox">The trading part puts you over your monthly limit. Lower it, or tap again to go ahead.</div>`;$("#sheetOk").dataset.armed=1;$("#sheetOk").textContent="Move anyway";return false}
    if(s>0&&gopts.length){fundGoal(S.goals.find(g=>g.id===V("sp-g")),s)}
    if(t>0){S.bank-=t;S.trading.balance+=t;S.trading.basis+=t;addTx({type:"move",cat:"To trading",amount:t,note:"Bank → Trading (payday split)"})}
    commit();if(s||t)say(`Paid yourself first: <b>${money(s+t)}</b> moved. That's how it's done.`,"happy",true)},{submitLabel:"Move it"});
}
function billSheet(b){
  const isNew=!b;b=b||{name:"",amount:"",freq:"monthly",next:"",cat:"Subscriptions"};
  openSheet(isNew?"New bill":"Edit "+b.name,txt("f-n","Name",b.name,"e.g. Phone")+`<div class="two">${amt("f-a","Amount",b.amount||"")}${sel("f-f","How often",[["weekly","Weekly"],["biweekly","Every 2 weeks"],["monthly","Monthly"],["quarterly","Every 3 months"],["yearly","Yearly"],["once","One time"]],b.freq)}</div>`+dte("f-d","Next due date",b.next)+sel("f-c","Category",EXP_CATS,b.cat),()=>{
   const n=V("f-n").trim();if(!n){toast("Give the bill a name");return false}
   const o={name:n,amount:N("f-a"),freq:V("f-f"),next:V("f-d")||null,cat:V("f-c")};
   if(isNew)S.bills.push({id:uid(),...o});else Object.assign(b,o);commit()},
   isNew?{}:{danger:{label:"Delete bill",run:()=>{S.bills=S.bills.filter(x=>x!==b);commit()}}});
}
function sourceSheet(s){
  const isNew=!s;s=s||{name:"",amount:"",freq:"biweekly",next:"",kind:"other"};
  openSheet(isNew?"New income source":"Edit "+s.name,txt("f-n","Name",s.name,"e.g. Side job")+`<div class="two">${amt("f-a","Usual amount",s.amount||"")}${sel("f-f","How often",[["weekly","Weekly"],["biweekly","Every 2 weeks"],["monthly","Monthly"],["once","One time"],["variable","Varies"]],s.freq)}</div>`+dte("f-d","Next expected date",s.next,"Leave blank if it varies.")+sel("f-k","Type",[["pay","Paycheck"],["rental","Rental"],["tips","Tips"],["other","Other"]],s.kind),()=>{
   const n=V("f-n").trim();if(!n){toast("Give it a name");return false}
   const o={name:n,amount:N("f-a"),freq:V("f-f"),next:V("f-d")||null,kind:V("f-k")};if(o.freq==="variable")o.next=null;
   if(isNew)S.sources.push({id:uid(),...o});else Object.assign(s,o);commit()},
   isNew?{}:{danger:{label:"Delete source",run:()=>{S.sources=S.sources.filter(x=>x!==s);commit()}}});
}
function goalSheet(g){
  const isNew=!g;g=g||{name:"",target:"",saved:0};
  openSheet(isNew?"New savings goal":"Edit goal",txt("f-n","Goal",g.name,"e.g. Emergency fund")+amt("f-t","Target amount",g.target||"")+(isNew?"":amt("f-s","Saved so far",g.saved)),()=>{
   const n=V("f-n").trim();if(!n){toast("Name the goal");return false}
   if(isNew)S.goals.push({id:uid(),name:n,target:N("f-t"),saved:0});else{g.name=n;g.target=N("f-t");g.saved=N("f-s")}commit()},
   isNew?{}:{danger:{label:"Delete goal",run:()=>{S.goals=S.goals.filter(x=>x!==g);commit()}}});
}
document.addEventListener("click",e=>{
  const av=e.target.closest("#avatar");if(av&&S){A.avatar();return}
  const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el)}
});

function installSteps(){return `<p style="margin-top:0"><b>iPhone (Safari)</b></p><ol style="margin:0 0 12px;padding-left:20px"><li>Tap the Share button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p><b>Android (Chrome)</b></p><ol style="margin:0;padding-left:20px"><li>Tap the ⋮ menu.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`}
async function doBackup(){
  const data=JSON.stringify({app:"crow-vault",v:1,exported:new Date().toISOString(),state:S});
  const name="crow-vault-backup-"+today()+".json";
  const file=new File([data],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Crow Vault backup"});markBackup();return}}
  catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);markBackup();
}
function markBackup(){if(!S)return;S.lastBackup=today();commit();say("Backed up. Save that file in Files or iCloud Drive so it's safe.","happy");toast("Backup created")}
document.getElementById("restoreFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  let obj=null;try{obj=JSON.parse(await f.text())}catch(err){}
  if(!obj||obj.app!=="crow-vault"||!obj.state){toast("That file isn't a Crow Vault backup");return}
  const when=obj.exported?fd(obj.exported.slice(0,10)):"an unknown date";
  openSheet("Restore backup",`<p style="margin-top:0">Replace everything on this phone with the backup from <b>${esc(when)}</b>?</p>`,()=>{S=normalize(obj.state);S.lastBackup=today();commit();say("Vault restored. Everything's back.","happy",true);window.__strike&&window.__strike()},{submitLabel:"Restore"});
});
boot();Buddy.start();
})();
</script>
